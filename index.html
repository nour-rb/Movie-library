<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My movie library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,
    wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
            <div class="header-content">
                <img class="logo" src="images/RATING.png" alt="logo">
            
                <nav class="navbar">
                    <a href="#">Menu</a>
                    <a href="#">Home</a>
                    <a href="#">Movies</a>
                    <a href="#">About</a>
                </nav>
            </div>
    </header>

    
    <section id="first-section">
        <div class="search-container">
            <input
                type="search"
                id="search-input"
                placeholder="Search movies or shows..."
            >
            <button class="search-btn" id="search-btn">Search</button>
        </div>

        <div class="media-buttons">
            <button class="media-btn">Shows</button>
            <button class="media-btn">Movies</button>
        </div>
    </section>


    
    <section id="second-section">

        <div class="section-heading">
            <h2>Recently Watched</h2>

            <div class="carousel-buttons">
                <button class="arrow-btn" id="prev-btn">
                    &#10094;
                </button>

                <button class="arrow-btn" id="next-btn">
                    &#10095;
                </button>
            </div>
        </div>

        <div class="movie-carousel">
            <div class="movie-track" id="movie-track">

                <!-- Movie cards will be added here using JavaScript -->

            </div>
        </div>

    </section>


    
 
    <section id="third-section">

        <div class="results-heading">
            <div>
                <h2>Results</h2>
                <p id="results-message"> </p>
            </div>

            <span class="results-count" id="results-count" hidden></span>
        </div>

        <div class="results-panel" id="results-panel">
            <div class="results-list" id="results-list">
                <!-- Search results appear here -->
            </div>
        </div>

    </section>

    
   
    <section id="fourth-section">
        <div class="bottom-buttons">
            <button id="rate-taste-btn">Rate My Taste</button>
            <button id="recommend-btn">Recommend Me Something</button>
        </div>
    </section>


    <footer>
        <a href="https://github.com/nour-rb">My Github</a>
        <a href="www.linkedin.com/in/aya-roubhi">My LinkedIn</a>
    </footer>
    <script src="script.js"></script>
</body>
</html>
